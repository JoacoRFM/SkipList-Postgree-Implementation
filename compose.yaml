services:
  postgres:
    build: .
    environment:
      POSTGRES_USER: bd2
      POSTGRES_PASSWORD: bd2_local
      POSTGRES_DB: bd2
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bd2 -d bd2"]
      interval: 5s
      timeout: 5s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql
      - ./sql:/workspace/sql:ro
volumes:
  pgdata:
